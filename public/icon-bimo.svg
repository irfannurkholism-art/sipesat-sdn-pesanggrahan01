  <path d="M168 158 L138 98 C132 86 146 76 156 84 L204 128 Z" fill="#DBEAFE"/>
  <path d="M344 158 L374 98 C380 86 366 76 356 84 L308 128 Z" fill="#DBEAFE"/>
